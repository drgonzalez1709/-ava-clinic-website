name: Reporte de error
description: Informar un problema técnico o visual del sitio
title: "[Error]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Describa qué ocurrió y en cuál página.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Dispositivo y navegador
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
